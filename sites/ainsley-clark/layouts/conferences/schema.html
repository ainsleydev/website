<!-- =====================
	Conference Schema (Event)
	===================== -->
{{ with .Params.event }}
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Event",
			"name": {{ $.Params.heading }},
			"description": {{ $.Params.lead }},
			{{ with .date -}}
				"startDate": {{ dateFormat "2006-01-02" . }},
			{{- end }}
			{{ with .location -}}
				"location": {
					"@type": "Place",
					"name": {{ . }}
				},
			{{- end }}
			{{ with $.Params.video -}}
				"recordedIn": {
					"@type": "VideoObject",
					"name": {{ $.Params.heading }},
					"url": {{ . }}
				},
			{{- end }}
			"performer": {
				"@type": "Person",
				"name": {{ $.Site.Params.person.name | default $.Site.Params.niceName }},
				"url": {{ $.Site.Params.url }}
			}
		}
	</script>
{{ end }}
